# Lịch chạy: GitHub tự chạy thongbao_telegram.py mỗi 15 phút, và cho phép bấm chạy tay để thử
name: Bao coin tang manh ve Telegram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quet va gui Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/workflows/thongbao_telegram.py
      - name: Luu danh sach da bao
        run: |
          git config user.name "bot-thong-bao"
          git config user.email "bot@users.noreply.github.com"
          git add da_bao.json
          git diff --cached --quiet || (git commit -m "Cap nhat danh sach da bao" && git push)
